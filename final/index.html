               style="flex: 1">

            </a>

            <!-- Link to your player profile form. -->
            <a href="#profile"
               class="w3-button w3-black"

    <!-- ==========================================

        <div class="w3-display-middle w3-center">

            <span class="w3-text-white" style="font-size: 80px">

                        </span>
                    </h2>
                    <div id="rallyGallery">
                        <img id="serve" src="serving.jpg" alt="Serve">
                        <img id="recieve" src="recieve.jpg" alt="Recieve">

                        <img id="spike" src="spiking.jpg" alt="Spike">
                    </div>

                    <!-- TODO: Write an introductory paragraph about
                         volleyball and the objective of the game. -->

                    <p>
                        <!-- Your introduction goes here. -->
                    </p>

                    <!-- TODO: Add another paragraph explaining

                    <p>
                        <!-- More information goes here. -->
                    </p>

                    <!-- IMAGE:
                         TODO: Replace the filename with your own image.
                         Update the alt text to describe the actual image.
                         Make sure the image is permitted for your use. -->

                    <img src="volleyball.webp"
                         alt="Description of the volleyball image"
                         style="width: 100%; margin-top: 16px">

                    <!-- OPTIONAL: A fact, quotation, or interesting detail.
                         You can remove this block if you don't need it. -->

                    <div class="w3-panel w3-leftbar w3-light-grey">

                        <p>
                            <!-- TODO: Add a volleyball fact or tip. -->
                        </p>

                    </div>

                </div>

            </section>

            <section class="w3-container" id="positions">

                <div class="w3-content" style="max-width: 1000px">

                    <!-- SECTION HEADING -->
                    <h2 class="w3-center w3-padding-64">
                        <span class="w3-tag w3-wide">
                            <!-- TODO: Section title -->
                            PLAYER POSITIONS
                        </span>
                    </h2>

                    <!-- INTRODUCTION:
                         TODO: Explain what the visitor will learn here. -->

                    <p>
                        <!-- Short introduction to the positions. -->
                    </p>

                    <!-- POSITION CARD CONTAINER:
                         JavaScript will select this element and insert
                         cards generated from your array of objects.

                         The ID is important. Keep it consistent with
                         the selector you use in your JavaScript file. -->

                        <h1 id="galleryHeading">Volleyball Positions</h1>

                        <div class="galleryContainer">
                            <img id="positionImage" src="" alt="Volleyball position image">

                            <dl class="positionDetails">
                            <dt>Name:</dt>
                            <dd id="positionName"></dd>

                            <dt>Details:</dt>
                            <dd id="positionDetails"></dd>

                            <dt>ID:</dt>
                            <dd id="positionID"></dd>
                            </dl>
                        </div>

                        <div class="buttons">
                            <button id="prev" type="button">Previous</button>
                            <button id="next" type="button">Next</button>
                        </div>
                    </div>

                </div>

            </section>


            <!-- ======================================
                 SECTION 3: SKILLS AND TRAINING TIPS
                 Add information about fundamental skills.
                 ====================================== -->

            <section class="w3-container" id="skills">

                <div class="w3-content" style="max-width: 700px">

                    <!-- SECTION HEADING -->
                    <h2 class="w3-center w3-padding-64">
                        <span class="w3-tag w3-wide">
                            <!-- TODO: Section title -->
                            SKILLS AND TRAINING
                        </span>
                    </h2>

                    <!-- TODO: Describe a volleyball skill,
                         such as serving, passing, setting, or hitting. -->

                    <p>
                        <!-- Your content goes here. -->
                    </p>

                    <!-- TODO: Add a list of useful tips.
                         Each li element represents one list item. -->

                    <ul>
                        <li><!-- TODO: First tip --></li>
                        <li><!-- TODO: Second tip --></li>
                        <li><!-- TODO: Third tip --></li>
                    </ul>

                    <!-- INTERACTIVE TIP:
                         TODO: Add a button that displays a training tip.
                         JavaScript will handle the click event.
                         The paragraph below can display the result. -->

                    <button class="w3-button w3-black"
                            id="tipButton"
                            type="button">
                        Show a Training Tip
                    </button>

                    <p id="tipDisplay">
                        <!-- JavaScript can display a tip here. -->
                    </p>

                </div>

            </section>


            <!-- ======================================
                 SECTION 4: PLAYER PROFILE FORM
                 Collect information from the visitor.
                 JavaScript will handle submission and storage.
                 ====================================== -->

            <section class="w3-container" id="profile">

                <div class="w3-content"
                     style="max-width: 700px; padding-bottom: 32px">

                    <!-- SECTION HEADING -->
                    <h2 class="w3-center w3-padding-64">
                        <span class="w3-tag w3-wide">
                            <!-- TODO: Section title -->
                            YOUR VOLLEYBALL PROFILE
                        </span>
                    </h2>

                    <!-- TODO: Explain what the form is for. -->

                    <p>
                        <!-- Form introduction goes here. -->
                    </p>

                    <!-- FORM:
                         JavaScript will prevent the default page reload,
                         retrieve the input values, display the result,
                         and save selected information in localStorage. -->

                    <form id="profileForm">

                        <!-- INPUT 1:
                             Visitor's name.
                             The name attribute identifies the form field. -->

                        <p>
                            <label for="playerName">Your Name</label>

                            <input class="w3-input w3-padding-16 w3-border"
                                   type="text"
                                   id="playerName"
                                   name="playerName"
                                   placeholder="Enter your name"
                                   required>
                        </p>

                        <!-- INPUT 2:
                             Visitor's favorite volleyball position. -->

                        <p>
                            <label for="favoritePosition">
                                Favorite Position
                            </label>

                            <select class="w3-select w3-border"
                                    id="favoritePosition"
                                    name="favoritePosition"
                                    required>

                                <option value="" disabled selected>
                                    Choose a position
                                </option>

                                <!-- TODO:
                                     Add options that match your
                                     volleyball position objects. -->

                                <option value="Setter">Setter</option>
                                <option value="Libero">Libero</option>
                                <option value="Outside Hitter">
                                    Outside Hitter
                                </option>
                                <option value="Middle Blocker">
                                    Middle Blocker
                                </option>

                            </select>
                        </p>

                        <!-- SUBMIT BUTTON:
                             JavaScript will listen for the form's submit
                             event and prevent the page from reloading. -->

                        <p>
                            <button class="w3-button w3-black"
                                    type="submit">
                                SAVE PROFILE
                            </button>
                        </p>

                    </form>

                    <!-- SUBMITTED INFORMATION:
                         JavaScript can display the visitor's
                         submitted name and favorite position here. -->

                    <div id="profileResult" class="w3-panel">

                        <!-- Submission result goes here. -->

                    </div>

                    <!-- STORED INFORMATION:
                         JavaScript can retrieve previously saved
                         information from localStorage and display it here. -->

                    <p id="savedProfile">
                        <!-- Previously saved profile goes here. -->
                    </p>

                </div>

            </section>
